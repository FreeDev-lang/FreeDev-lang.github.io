<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- GH Pages SPA: decode /?/path from 404 redirect & auth redirects (spa-github-pages) -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('/')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fria — Furniture, Reimagined in Your Space</title>
    <meta name="description" content="Fria — luxury furniture with true-scale AR preview. Shop curated pieces for every room and see them in your space before you buy." />
    <meta name="application-name" content="Fria" />
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Maison type system: Playfair Display (editorial serif) + DM Sans (working sans),
         with Amiri + Almarai as the Arabic luxury counterparts (applied via [dir=rtl]). -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
